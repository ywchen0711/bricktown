<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>積木小鎮・角色</title><style>body{margin:0;background:#20242c}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<script type="module">
// the cast as minifigures, in a few poses, under studio light
import * as THREE from './lib/three.module.min.js';
import { makeFig } from './js/minifig.js';
import { SERIES } from './series/neighbours/series.js';
const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.setPixelRatio(Math.min(2, devicePixelRatio)); R.setSize(innerWidth, innerHeight); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(R.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#dfe8f0');
scene.add(new THREE.HemisphereLight('#ffffff', '#b8a890', 1.4)); const sun = new THREE.DirectionalLight('#fff4e0', 2.6); sun.position.set(3, 6, 5); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: '#f2f2ee', roughness: 0.9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ids = Object.keys(SERIES.cast).filter((k) => SERIES.cast[k].kind !== 'voice'); let x = -2.6;
const poses = [{}, { armR: -2.7, wristR: 0.5, outR: 0.2, head: 0.3 }, { armL: -1.2, armR: -1.4, hipL: 0.5, hipR: -0.5, tilt: 0.05 }];
const faces = [{ mouth: { smile: 0.5 } }, { happy: 1, mouth: { open: 0.7, smile: 1, wide: 0.7 }, blush: 0.6 }, { eyes: 1.3, brow: 1, mouth: { open: 0.6, round: 1, smile: 0 } }];
for (const id of ids) for (let k = 0; k < 3; k++) { const F = makeFig(SERIES.cast[id]); F.pose({ x, z: 0, yaw: -0.35 + k * 0.2, ...poses[k] }); F.face(faces[k]); scene.add(F.root); x += 0.62; }
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100); cam.position.set(-0.1, 1.4, 7.2); cam.lookAt(-0.1, 0.75, 0);
R.render(scene, cam); window.DONE = true;
</script></body></html>
