<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>積木小鎮 Brick Town</title>
  <meta name="description" content="積木小鎮：用積木人偶拍連續劇的 3D 框架。寫好劇本，導演程式自動排走位、表情、鏡頭與配音。第一部：《隔壁的阿樂》積木版。">
  <meta name="theme-color" content="#2a2230">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='13' font-size='13'%3E🧱%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div id="frame">
    <canvas id="cv"></canvas><div id="fade"></div>
    <div id="title"></div>
    <div id="sub"></div>
    <button id="cam" hidden>🎬 回到導演鏡頭</button>
    <div id="hint" hidden>拖曳畫面可以轉視角 · Drag to look around</div>
    <div id="start">
      <div id="st"></div>
      <p id="blurb"></p>
      <nav id="eps"></nav>
      <p id="loading" hidden>準備中… Getting ready…</p>
    </div>
    <div id="ui" hidden>
      <button id="home" title="選集">☰</button><button id="pp">▶</button>
      <input id="bar" type="range" min="0" max="1" step="0.0001" value="0">
      <span id="time">0:00</span><span id="eptitle"></span>
      <button id="lang">EN</button><button id="fs">⛶</button>
    </div>
  </div>
  <script src="/hub.js" defer data-pos="top-right"></script>
  <script type="module" src="js/player.js?v=2"></script>
</body>
</html>
